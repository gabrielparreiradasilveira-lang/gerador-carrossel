:root{--bg:#f3f4f7;--panel:#fff;--txt:#1b2333;--mut:#6b7488;--line:#e1e4ec;--acc:#2f5bea}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:PInter,Inter,system-ui,sans-serif;color:var(--txt);background:var(--bg);display:grid;grid-template-columns:430px 1fr;height:100vh;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:14px}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px 18px 30px}
h1{font-family:PMont,Montserrat,sans-serif;font-size:20px;margin:0 0 6px}
.amostra{display:inline-block;background:#fff1e6;color:#b34700;border:1px solid #ffc999;border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:700;letter-spacing:.03em}
.sec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.sec h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
label{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 3px;font-weight:700}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fbfbfd;color:var(--txt)}
textarea{resize:vertical;line-height:1.35}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer;color:var(--txt)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:hover{filter:brightness(.97)}
.pals{display:flex;gap:8px;flex-wrap:wrap}
.pal{border:2px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:#fff}
.pal.on{border-color:var(--acc)}
.pal i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid #0002}
.cores{display:flex;gap:10px;align-items:flex-end}
.cores label{margin-top:4px}
.cores input[type=color]{width:52px;height:32px;border:1px solid var(--line);border-radius:6px;padding:2px;background:#fff}
.sl{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;background:#fbfbfd;cursor:pointer}
.sl.on{border-color:var(--acc);box-shadow:0 0 0 2px #2f5bea22}
.sl .h{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.sl .h b{font-size:13px;min-width:22px}
.sl .h select{flex:1;padding:5px 8px}
.sl .warn{color:#b34700;font-size:11.5px;margin-top:4px;display:none}
.sl .warn.on{display:block}
main{display:grid;grid-template-rows:auto 1fr auto;min-width:0;min-height:0}
.bar{display:flex;gap:10px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar .sp{flex:1}
.bar .info{font-size:13px;color:var(--mut)}
.stage{display:flex;align-items:center;justify-content:center;gap:16px;padding:16px;min-height:0}
.stage canvas{height:100%;max-height:100%;width:auto;aspect-ratio:1080/1350;border-radius:6px;box-shadow:0 10px 30px #0b163033,0 2px 6px #0b163022;background:#fff}
.nav{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer}
.thumbs{display:flex;gap:10px;padding:10px 18px 14px;overflow-x:auto;background:var(--panel);border-top:1px solid var(--line)}
.thumbs canvas{width:72px;height:90px;border-radius:4px;cursor:pointer;border:2px solid transparent;flex:0 0 auto}
.thumbs canvas.on{border-color:var(--acc)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2333;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

    "cta":       { "rotulo": "CTA",               "selo": "",                    "titulo": "Salva pra revisar antes da {cert}", "texto": "[Chamada final: seguir {handle}, comentar uma dúvida ou mandar pra quem vai fazer a prova]" }
  },
  "estruturaPorQuantidade": {
    "5":  ["gancho","problema","conceito","pegadinha","cta"],
    "6":  ["gancho","problema","conceito","exemplo","pegadinha","cta"],
    "7":  ["gancho","problema","conceito","exemplo","pegadinha","resumo","cta"],
    "8":  ["gancho","problema","conceito","extra","exemplo","pegadinha","resumo","cta"],
    "9":  ["gancho","problema","conceito","extra","exemplo","extra","pegadinha","resumo","cta"],
    "10": ["gancho","problema","conceito","extra","exemplo","extra","pegadinha","extra","resumo","cta"]
  },
  "paletas": [
    { "nome": "Marinho & dourado", "fundo": "#0f1b33", "texto": "#f4f1ea", "destaque": "#f2b632" },
    { "nome": "Papel editorial",   "fundo": "#f6f1e7", "texto": "#1c1c1c", "destaque": "#d9480f" },
    { "nome": "Verde mercado",     "fundo": "#0c3b2e", "texto": "#effaf2", "destaque": "#9be37a" }
  ]
}
</script>

<aside>

  <span class="amostra">CONTEÚDO DE EXEMPLO — revisar</span>

<main>
  <div class="bar">
    <span class="info" id="info">Slide 1 de 7 · 1080×1350</span>
    <span class="sp"></span>
    <button class="btn" id="bPng">Baixar PNG deste slide</button>
    <button class="btn" id="bTodos">Baixar todos (PNGs)</button>
    <button class="btn pri" id="bZip">Baixar .zip</button>
  </div>
  <div class="stage">
    <button class="nav" id="bAnt" aria-label="Slide anterior">‹</button>

</main>
<div class="toast" id="toast"></div>

<script>
const MODELO = JSON.parse(document.getElementById('modelo-carrossel').textContent);
const W = 1080, H = 1350, M = 96;
const $ = id => document.getElementById(id);
const CHAVE = 'gerador-carrossel-v1';

let E = carregar() || {
  tema: 'Liquidez', cert: 'CPA', handle: MODELO.handlePadrao, fonte: 100,
  cores: { ...MODELO.paletas[0] }, paleta: 0, atual: 0, slides: []
};
function carregar() { try { return JSON.parse(localStorage.getItem(CHAVE)); } catch (_) { return null; } }
function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify(E)); } catch (_) {} }

const sub = s => s.replace(/\{tema\}/g, E.tema || 'o tema').replace(/\{cert\}/g, E.cert.replace(' ', '\u00A0')).replace(/\{handle\}/g, E.handle || '');
const slideDoPapel = p => ({ papel: p, titulo: sub(MODELO.papeis[p].titulo), texto: sub(MODELO.papeis[p].texto) });
function aplicarModelo(n) { E.slides = MODELO.estruturaPorQuantidade[String(n)].map(slideDoPapel); E.atual = 0; }
function ajustarQuantidade(n) {
  while (E.slides.length < n) E.slides.splice(E.slides.length - 1, 0, slideDoPapel('extra'));
  while (E.slides.length > n) { // remove primeiro os slides "extra"; depois o penúltimo (nunca o gancho nem o CTA)
    const papeis = E.slides.map(s => s.papel);
    const alvo = ['extra', 'resumo', 'exemplo', 'problema'].map(p => papeis.lastIndexOf(p)).find(ix => ix > 0 && ix < papeis.length - 1);
    E.slides.splice(alvo != null ? alvo : E.slides.length - 2, 1);
  }
  E.atual = Math.min(E.atual, n - 1);
}
if (!E.slides.length) aplicarModelo(7);

/* ---------------- desenho no canvas ---------------- */
function lum(hex) { const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }
const contraste = hex => lum(hex) > .4 ? '#111111' : '#ffffff';
function alfa(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

function quebrar(ctx, texto, larg) {
  const linhas = [];
  for (const par of String(texto).split('\n')) {
    const bullet = /^\s*[-•]\s+/.test(par);
    const palavras = par.replace(/^\s*[-•]\s+/, '').split(/[ \t]+/).filter(Boolean);
    let l = '', primeira = true; const recuo = bullet ? ctx.measureText('•  ').width : 0;
    if (!palavras.length) { linhas.push({ t: '', b: false, r: 0 }); continue; }
    for (const p of palavras) {
      const t = l ? l + ' ' + p : p;
      if (ctx.measureText(t).width > larg - recuo && l) { linhas.push({ t: l, b: bullet && primeira, r: recuo }); l = p; primeira = false; }
      else l = t;
    }
    linhas.push({ t: l, b: bullet && primeira, r: recuo });
  }
  return linhas;
}

function desenhar(ctx, s, i, n) {
  const C = E.cores, k = E.fonte / 100, ultimo = i === n - 1, capa = s.papel === 'gancho', cta = s.papel === 'cta';
  ctx.save();
  ctx.fillStyle = C.fundo; ctx.fillRect(0, 0, W, H);
  // formas decorativas
  ctx.lineWidth = 34; ctx.strokeStyle = alfa(C.destaque, .16);
  ctx.beginPath(); ctx.arc(W + 30, capa || cta ? 170 : -40, capa || cta ? 330 : 170, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 3; ctx.strokeStyle = alfa(C.texto, .10);
  ctx.beginPath(); ctx.arc(-40, H - 60, 250, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = alfa(C.destaque, .5); for (let a = 0; a < 4; a++) for (let b = 0; b < 3; b++) { ctx.beginPath(); ctx.arc(W - M - 4 - a * 26, H - 238 - b * 26, 4, 0, Math.PI * 2); ctx.fill(); }
  // topo: selo da certificação + contador
  ctx.textBaseline = 'alphabetic';
  ctx.font = '800 30px PMont, Montserrat, sans-serif';
  const cert = E.cert.toUpperCase(), wc = ctx.measureText(cert).width + 44;
  ctx.fillStyle = C.destaque; rr(ctx, M, M - 6, wc, 58, 29); ctx.fill();
  ctx.fillStyle = contraste(C.destaque); ctx.fillText(cert, M + 22, M + 34);
  ctx.font = '700 30px PInter, Inter, sans-serif'; ctx.fillStyle = alfa(C.texto, .6); ctx.textAlign = 'right';
  ctx.fillText(`${i + 1}/${n}`, W - M, M + 34); ctx.textAlign = 'left';

  // área de texto
  const topo = 250, base = H - 210, larg = W - 2 * M;
  const selo = (MODELO.papeis[s.papel] || {}).selo || '';
  let esc = 1, blocos, alt;
  const medir = f => {
    const ts = (capa ? 104 : cta ? 84 : 72) * k * f, bs = (capa ? 44 : 42) * k * f;
    ctx.font = `800 ${ts}px PMont, Montserrat, sans-serif`; const lt = quebrar(ctx, s.titulo, larg);
    ctx.font = `400 ${bs}px PInter, Inter, sans-serif`; const lb = quebrar(ctx, s.texto, larg);
    const hSelo = selo ? 74 : 0, hT = lt.length * ts * 1.12, hB = s.texto.trim() ? 40 * f + lb.length * bs * 1.42 : 0;
    return { ts, bs, lt, lb, hSelo, hT, hB, total: hSelo + hT + hB };
  };
  do { blocos = medir(esc); if (blocos.total <= base - topo) break; esc -= 0.04; } while (esc > 0.55);
  s._reduzido = esc < 0.99;
  let y = Math.max(topo, topo + (base - topo - blocos.total) * (capa || cta ? .5 : .32));
  if (selo) {
    ctx.font = '800 28px PMont, Montserrat, sans-serif'; ctx.fillStyle = C.destaque;
    ctx.fillRect(M, y + 4, 52, 6); ctx.fillText(selo, M + 70, y + 18); y += blocos.hSelo;
  }
  ctx.fillStyle = C.texto; ctx.font = `800 ${blocos.ts}px PMont, Montserrat, sans-serif`;
  for (const l of blocos.lt) { y += blocos.ts; ctx.fillText(l.t, M, y); y += blocos.ts * .12; }
  if (s.texto.trim()) {
    y += 40 * esc;
    if (capa || cta) { ctx.fillStyle = C.destaque; ctx.fillRect(M, y - 14, 90, 8); y += 22; }
    ctx.font = `400 ${blocos.bs}px PInter, Inter, sans-serif`; ctx.fillStyle = alfa(C.texto, .88);
    for (const l of blocos.lb) {
      y += blocos.bs * 1.08;
      if (l.b) { ctx.fillStyle = C.destaque; ctx.fillText('•', M, y); ctx.fillStyle = alfa(C.texto, .88); }
      ctx.fillText(l.t, M + l.r, y); y += blocos.bs * .34;
    }
  }
  // rodapé
  ctx.fillStyle = alfa(C.texto, .18); ctx.fillRect(M, H - 150, W - 2 * M, 2);
  ctx.font = '700 32px PInter, Inter, sans-serif'; ctx.fillStyle = C.texto; ctx.fillText(E.handle || '', M, H - 92);
  ctx.textAlign = 'right';
  if (!ultimo) {
    ctx.fillStyle = C.destaque; ctx.strokeStyle = C.destaque; ctx.font = '800 30px PMont, Montserrat, sans-serif';
    ctx.fillText('ARRASTA', W - M - 62, H - 92);
    const ay = H - 103, ax = W - M; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(ax - 44, ay); ctx.lineTo(ax, ay); ctx.moveTo(ax - 14, ay - 13); ctx.lineTo(ax, ay); ctx.lineTo(ax - 14, ay + 13); ctx.stroke();
  }
  else { ctx.fillStyle = alfa(C.texto, .7); ctx.font = '700 30px PInter, Inter, sans-serif'; ctx.fillText('salvar · compartilhar · seguir', W - M, H - 92); }
  ctx.restore();
}
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function renderSlide(i) { const c = document.createElement('canvas'); c.width = W; c.height = H; desenhar(c.getContext('2d'), E.slides[i], i, E.slides.length); return c; }

/* ---------------- interface ---------------- */
let agendado = false;
function atualizar() { if (agendado) return; agendado = true; requestAnimationFrame(() => { agendado = false; renderTudo(); salvar(); }); }
function renderTudo() {
  const n = E.slides.length;
  const cvs = E.slides.map((_, i) => renderSlide(i));
  const pv = $('preview').getContext('2d'); pv.clearRect(0, 0, W, H); pv.drawImage(cvs[E.atual], 0, 0);
  const th = $('thumbs');
  if (th.children.length !== n) { th.innerHTML = ''; for (let i = 0; i < n; i++) { const t = document.createElement('canvas'); t.width = 216; t.height = 270; t.onclick = () => selecionar(i); th.appendChild(t); } }
  [...th.children].forEach((t, i) => { const c = t.getContext('2d'); c.drawImage(cvs[i], 0, 0, 216, 270); t.classList.toggle('on', i === E.atual); t.title = 'Slide ' + (i + 1); });
  document.querySelectorAll('.sl').forEach((d, i) => { d.classList.toggle('on', i === E.atual); d.querySelector('.warn').classList.toggle('on', !!E.slides[i]._reduzido); });
  $('info').textContent = `Slide ${E.atual + 1} de ${n} · ${(MODELO.papeis[E.slides[E.atual].papel] || {}).rotulo || ''} · 1080×1350`;
}
function selecionar(i) { E.atual = i; atualizar(); const d = document.querySelectorAll('.sl')[i]; if (d && document.activeElement && !d.contains(document.activeElement)) d.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }

function renderEditores() {
  const opts = Object.entries(MODELO.papeis).map(([k, v]) => `<option value="${k}">${v.rotulo}</option>`).join('');
  $('slides').innerHTML = E.slides.map((s, i) => `
    <div class="sl" data-i="${i}">
      <div class="h"><b>${i + 1}</b><select data-f="papel" aria-label="Tipo do slide ${i + 1}">${opts}</select></div>
      <textarea data-f="titulo" rows="2" aria-label="Título do slide ${i + 1}"></textarea>
      <textarea data-f="texto" rows="3" aria-label="Texto do slide ${i + 1}" style="margin-top:6px"></textarea>
      <div class="warn">Texto longo: a fonte deste slide foi reduzida para caber.</div>
    </div>`).join('');
  document.querySelectorAll('.sl').forEach((d, i) => {
    d.querySelectorAll('[data-f]').forEach(el => { el.value = E.slides[i][el.dataset.f]; el.oninput = () => { E.slides[i][el.dataset.f] = el.value; E.atual = i; atualizar(); }; });
    d.addEventListener('focusin', () => { if (E.atual !== i) { E.atual = i; atualizar(); } });
    d.onclick = () => { if (E.atual !== i) { E.atual = i; atualizar(); } };
  });
}
function renderPaletas() {
  $('pals').innerHTML = MODELO.paletas.map((p, i) => `<button class="pal ${E.paleta === i ? 'on' : ''}" data-i="${i}"><i style="background:${p.fundo}"></i><i style="background:${p.destaque}"></i>${p.nome}</button>`).join('')
    + `<span class="pal ${E.paleta === -1 ? 'on' : ''}" style="cursor:default">Personalizada</span>`;
  $('pals').querySelectorAll('button').forEach(b => b.onclick = () => { E.paleta = +b.dataset.i; E.cores = { ...MODELO.paletas[E.paleta] }; sincCores(); renderPaletas(); atualizar(); });
}
function sincCores() { $('cFundo').value = E.cores.fundo; $('cTexto').value = E.cores.texto; $('cDest').value = E.cores.destaque; }
[['cFundo', 'fundo'], ['cTexto', 'texto'], ['cDest', 'destaque']].forEach(([id, k]) => $(id).oninput = e => { E.cores[k] = e.target.value; E.paleta = -1; renderPaletas(); atualizar(); });

$('iTema').value = E.tema; $('iCert').value = E.cert; $('iN').value = E.slides.length; $('iHandle').value = E.handle; $('iFonte').value = E.fonte; $('vFonte').textContent = E.fonte + '%';
$('iTema').oninput = e => { E.tema = e.target.value; atualizar(); };
$('iCert').onchange = e => { E.cert = e.target.value; atualizar(); };
$('iHandle').oninput = e => { E.handle = e.target.value; atualizar(); };
$('iFonte').oninput = e => { E.fonte = +e.target.value; $('vFonte').textContent = E.fonte + '%'; atualizar(); };
$('iN').onchange = e => { const n = Math.max(5, Math.min(10, Math.round(+e.target.value || 7))); e.target.value = n; ajustarQuantidade(n); renderEditores(); atualizar(); };
$('bModelo').onclick = () => {
  const editado = E.slides.some(s => !/^\[|^O que é|^Pra levar|^Salva/.test(s.titulo));
  if (editado && !confirm('Isso troca o texto de todos os slides pelos textos-guia. Continuar?')) return;
  aplicarModelo(Math.max(5, Math.min(10, +$('iN').value || 7))); renderEditores(); atualizar(); toast('Estrutura preenchida. Troque os [colchetes] pelo seu conteúdo.');
};
$('bAnt').onclick = () => selecionar((E.atual - 1 + E.slides.length) % E.slides.length);
$('bProx').onclick = () => selecionar((E.atual + 1) % E.slides.length);
document.addEventListener('keydown', e => { if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (e.key === 'ArrowRight') $('bProx').click(); if (e.key === 'ArrowLeft') $('bAnt').click(); });

/* ---------------- exportação: PNG e ZIP (sem bibliotecas externas) ---------------- */
const slug = () => (E.tema || 'carrossel').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'carrossel';
const nomeArq = i => `carrossel-${slug()}-${String(i + 1).padStart(2, '0')}.png`;
const pngBlob = i => new Promise(r => renderSlide(i).toBlob(r, 'image/png'));
function baixar(blob, nome) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(arquivos) { // método "store" (PNG já é comprimido)
  const enc = new TextEncoder(), partes = [], central = []; let off = 0;
  const d = new Date(), dt = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(), tm = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  for (const f of arquivos) {
    const nome = enc.encode(f.nome), crc = crc32(f.dados), n = f.dados.length;
    const lh = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, tm, 2], [12, dt, 2], [14, crc, 4], [18, n, 4], [22, n, 4], [26, nome.length, 2], [28, 0, 2]].forEach(([o, v, s]) => s === 4 ? lh.setUint32(o, v, true) : lh.setUint16(o, v, true));
    partes.push(new Uint8Array(lh.buffer), nome, f.dados);
    const ch = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, tm, 2], [14, dt, 2], [16, crc, 4], [20, n, 4], [24, n, 4], [28, nome.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, off, 4]].forEach(([o, v, s]) => s === 4 ? ch.setUint32(o, v, true) : ch.setUint16(o, v, true));
    central.push(new Uint8Array(ch.buffer), nome);
    off += 30 + nome.length + n;
  }
  const tamC = central.reduce((a, b) => a + b.length, 0), fim = new DataView(new ArrayBuffer(22));
  [[0, 0x06054b50, 4], [8, arquivos.length, 2], [10, arquivos.length, 2], [12, tamC, 4], [16, off, 4]].forEach(([o, v, s]) => s === 4 ? fim.setUint32(o, v, true) : fim.setUint16(o, v, true));
  return new Blob([...partes, ...central, new Uint8Array(fim.buffer)], { type: 'application/zip' });
}
$('bPng').onclick = async () => { baixar(await pngBlob(E.atual), nomeArq(E.atual)); toast('PNG 1080×1350 baixado.'); };
$('bTodos').onclick = async () => { for (let i = 0; i < E.slides.length; i++) { baixar(await pngBlob(i), nomeArq(i)); await new Promise(r => setTimeout(r, 350)); } toast(E.slides.length + ' PNGs baixados (o navegador pode pedir permissão para vários downloads).'); };
$('bZip').onclick = async () => {
  const arqs = []; for (let i = 0; i < E.slides.length; i++) arqs.push({ nome: nomeArq(i), dados: new Uint8Array(await (await pngBlob(i)).arrayBuffer()) });
  baixar(zip(arqs), `carrossel-${slug()}.zip`); toast('.zip com ' + arqs.length + ' slides baixado.');
};
let tt; function toast(m) { $('toast').textContent = m; $('toast').classList.add('on'); clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('on'), 2600); }

/* ---------------- início: espera as fontes embutidas carregarem ---------------- */
Promise.all(['800 40px PMont', '400 40px PInter', '700 40px PInter'].map(f => document.fonts.load(f))).finally(() => {
  sincCores(); renderPaletas(); renderEditores(); renderTudo(); window.__pronto = true;
});
window.__carrossel = { get estado() { return E; }, renderSlide, zip, crc32 };
</script>
